<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image — George Suarez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Rendered at exactly 1200x630 by scripts/generate-og-image.ts.
         Colors mirror the default "achievement" theme in src/index.css. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 64px 68px;
        background: #0f141e;
        color: #e8ecf1;
        font-family: "Share Tech Mono", ui-monospace, monospace;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(74, 158, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(74, 158, 255, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      .glow-blue {
        position: absolute;
        top: -420px;
        left: -240px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(74, 158, 255, 0.2), transparent 62%);
      }

      .glow-gold {
        position: absolute;
        right: -260px;
        bottom: -460px;
        width: 860px;
        height: 860px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 215, 0, 0.14), transparent 62%);
      }

      .left {
        position: relative;
        flex: 0 0 540px;
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        font-size: 23px;
        color: #4a9eff;
        margin-bottom: 16px;
      }

      .eyebrow span {
        color: #ffd700;
      }

      h1 {
        font-family: Orbitron, "Helvetica Neue", sans-serif;
        font-weight: 900;
        font-size: 92px;
        line-height: 0.94;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: #ffd700;
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.35);
        margin-bottom: 26px;
      }

      .badge {
        align-self: flex-start;
        margin-bottom: 30px;
        padding: 11px 20px 11px 24px;
        background: #4a9eff;
        color: #0f141e;
        font-family: Orbitron, "Helvetica Neue", sans-serif;
        font-weight: 900;
        font-size: 21px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }

      .stack {
        font-size: 19px;
        color: #9aa4b2;
      }

      .stack em {
        color: #4a9eff;
        font-style: normal;
      }

      .terminal {
        position: relative;
        flex: 1 1 auto;
        border: 1px solid rgba(107, 114, 128, 0.35);
        background: #161e2d;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 14px 18px;
        border-bottom: 1px solid rgba(107, 114, 128, 0.25);
        background: rgba(74, 158, 255, 0.06);
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .dot-red {
        background: #ff5f57;
      }

      .dot-amber {
        background: #febc2e;
      }

      .dot-green {
        background: #28c840;
      }

      .tab {
        margin-left: 10px;
        font-size: 16px;
        color: #8b96a8;
      }

      .body {
        padding: 22px 24px;
        font-size: 17px;
        line-height: 1.85;
      }

      .cmd {
        color: #4a9eff;
      }

      .out {
        color: #c3cbd8;
      }

      .accent {
        color: #ffd700;
      }

      .cursor {
        display: inline-block;
        width: 9px;
        height: 18px;
        margin-left: 4px;
        vertical-align: -3px;
        background: #ffd700;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow-blue"></div>
    <div class="glow-gold"></div>

    <div class="left">
      <p class="eyebrow"><span>$</span> whoami</p>
      <h1>George<br />Suarez</h1>
      <p class="badge">Software Engineer</p>
      <p class="stack">TypeScript <em>·</em> React Native <em>·</em> Effect <em>·</em> Rust</p>
    </div>

    <div class="terminal">
      <div class="titlebar">
        <span class="dot dot-red"></span>
        <span class="dot dot-amber"></span>
        <span class="dot dot-green"></span>
        <span class="tab">george@portfolio: ~</span>
      </div>
      <div class="body">
        <p class="cmd">$ ls ~/projects</p>
        <p class="out">
          refactor/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;subby/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;rarify/
        </p>
        <p class="out">
          trailfinder/&nbsp;&nbsp;lfguild/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;rusty-vault/
        </p>
        <p class="cmd">$ cat contact.txt</p>
        <p class="accent">georgejsuarez.com</p>
        <p class="out">github.com/georgesuarez</p>
        <p class="out">linkedin.com/in/george-suarez<span class="cursor"></span></p>
      </div>
    </div>
  </body>
</html>
